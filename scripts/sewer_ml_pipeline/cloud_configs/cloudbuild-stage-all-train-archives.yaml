steps:
- name: python:3.11-slim
  id: prepare-runtime
  entrypoint: bash
  args: [-c, "python -m pip install --no-cache-dir --target=/workspace/archive-deps google-cloud-storage requests"]
- name: python:3.11-slim
  id: stage-train-archives-sequentially
  waitFor: [prepare-runtime]
  entrypoint: bash
  secretEnv: [SEWER_ML_DOWNLOAD_PASSWORD]
  args:
  - -c
  - |
    set -eu
    for archive_number in $$(seq -w 1 13); do
      archive_name="train$${archive_number}"
      PYTHONPATH=/workspace/archive-deps python scripts/sewer_ml_pipeline/stage_remote_archive.py \
        --reuse-existing \
        --url="https://sciencedata.dk/public/Large%20AAU%20files/Sewer_ML/$${archive_name}.zip" \
        --project="$PROJECT_ID" \
        --bucket=joint-inspection-510310-data \
        --object="datasets/sewer-ml/source/archives/$${archive_name}.zip" \
        --output="/workspace/$${archive_name}.json"
    done
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/sewer-ml-download-password/versions/latest
    env: SEWER_ML_DOWNLOAD_PASSWORD
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 30
timeout: 21600s
