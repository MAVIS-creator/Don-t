steps:
- name: gcr.io/cloud-builders/docker
  id: build-inspect-view-fusion
  args:
  - build
  - -f
  - scripts/sewer_ml_pipeline/cloud_configs/legacy-evaluator.Dockerfile
  - -t
  - europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/inspect-view-fusion:$BUILD_ID
  - .
- name: gcr.io/cloud-builders/docker
  id: smoke-inspect-view-fusion
  entrypoint: docker
  args:
  - run
  - --rm
  - --entrypoint
  - python
  - europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/inspect-view-fusion:$BUILD_ID
  - scripts/sewer_ml_pipeline/cloud_inspect_view_fusion.py
  - --help
- name: gcr.io/cloud-builders/docker
  id: push-inspect-view-fusion
  args:
  - push
  - europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/inspect-view-fusion:$BUILD_ID
images:
- europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/inspect-view-fusion:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
