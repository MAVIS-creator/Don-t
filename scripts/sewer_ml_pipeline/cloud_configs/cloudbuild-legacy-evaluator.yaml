steps:
- name: gcr.io/cloud-builders/docker
  id: build-legacy-evaluator
  args:
  - build
  - -f
  - scripts/sewer_ml_pipeline/cloud_configs/legacy-evaluator.Dockerfile
  - -t
  - europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/legacy-evaluator:$BUILD_ID
  - .
- name: gcr.io/cloud-builders/docker
  id: smoke-legacy-evaluator
  entrypoint: docker
  args:
  - run
  - --rm
  - europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/legacy-evaluator:$BUILD_ID
  - --help
- name: gcr.io/cloud-builders/docker
  id: push-legacy-evaluator
  args:
  - push
  - europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/legacy-evaluator:$BUILD_ID
images:
- europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/legacy-evaluator:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
