steps:
- name: gcr.io/cloud-builders/docker
  id: prepare-wrc-trainer
  args: ['build','-f','scripts/sewer_ml_pipeline/cloud_configs/wrc-worker.Dockerfile','-t','europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/wrc-v3:$BUILD_ID','.']
- name: gcr.io/cloud-builders/docker
  id: publish-wrc-trainer
  waitFor: ['prepare-wrc-trainer']
  args: ['push','europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/wrc-v3:$BUILD_ID']
- name: europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/wrc-v3:$BUILD_ID
  id: smoke-wrc
  waitFor: ['publish-wrc-trainer']
  args:
  - --project=$PROJECT_ID
  - --base-weights=gs://joint-inspection-510310-data/models/external/wrc/inceptionresnetv2/v1/weights.h5
  - --rights-manifest=gs://joint-inspection-510310-data/provenance/wrc_rights.json
  - --config-id=wrc-smoke-$BUILD_ID
  - --smoke
- name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  id: submit-one-l4-wrc
  waitFor: ['smoke-wrc']
  entrypoint: bash
  args:
  - -c
  - |
    set -euo pipefail
    # BUILD_ID is a Cloud Build substitution, not an exported shell variable.
    # Use the full UUID so bash never attempts an unsupported substring expansion.
    job="sewer-ml-wrc-20k-$BUILD_ID"
    cat > /workspace/job.json <<EOF
    {"taskGroups":[{"taskSpec":{"runnables":[{"container":{"imageUri":"europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/wrc-v3:$BUILD_ID","commands":["--project=$PROJECT_ID","--train=gs://joint-inspection-510310-data/datasets/sewer-ml/curated-v3/20k/splits/train.csv","--early-stop=gs://joint-inspection-510310-data/datasets/sewer-ml/curated-v3/20k/splits/early_stop.csv","--threshold-tune=gs://joint-inspection-510310-data/datasets/sewer-ml/curated-v3/20k/splits/threshold_tune.csv","--dev-report=gs://joint-inspection-510310-data/datasets/sewer-ml/curated-v3/20k/splits/dev_report.csv","--base-weights=gs://joint-inspection-510310-data/models/external/wrc/inceptionresnetv2/v1/weights.h5","--rights-manifest=gs://joint-inspection-510310-data/provenance/wrc_rights.json","--output-prefix=gs://joint-inspection-510310-data/models/sewer-ml/v4/research-candidates/20k-wrc-l4-$BUILD_ID","--config-id=20k-wrc-l4-$BUILD_ID","--epochs=20","--batch-size=16"]}}],"computeResource":{"cpuMilli":8000,"memoryMib":28672},"maxRunDuration":"43200s","maxRetryCount":1},"taskCount":1,"parallelism":1}],"allocationPolicy":{"location":{"allowedLocations":["regions/us-central1"]},"instances":[{"policy":{"machineType":"g2-standard-8","provisioningModel":"STANDARD","accelerators":[{"type":"nvidia-l4","count":"1"}],"bootDisk":{"type":"pd-balanced","sizeGb":"150"}}}],"installGpuDrivers":true},"logsPolicy":{"destination":"CLOUD_LOGGING"}}
    EOF
    echo "GPU Batch submission disabled: use the reviewed /code Batch command with exact confirmation."
images:
- europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/wrc-v3:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
timeout: 7200s
